spring.application.name=saga-orchestrator
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SAGA_DB_URL:jdbc:mysql://localhost:3306/saga_orchestrator}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:practice}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
saga.services.team-url=${TEAM_SERVICE_URL:http://localhost:8081}
saga.services.player-url=${PLAYER_SERVICE_URL:http://localhost:8082}
