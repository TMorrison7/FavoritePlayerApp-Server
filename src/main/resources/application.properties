spring.application.name=favoriteplayerapp_server
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/favoriteplayer?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=tremaun22
logging.level.org.hibernate.SQL_BIND=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/favorite-player
logging.level.org.hibernate.SQL=DEBUG
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
app.kafka.team-created-topic=team-created-events
app.kafka.player-created-topic=player-created-events
app.outbox.poll-interval-ms=1000